<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorizonStatus - Live System Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #08090d;
            --bg-primary: #0d0f15;
            --bg-secondary: #141720;
            --bg-tertiary: #1b1f2b;
            --border: #262d40;
            --text-primary: #e4e8f1;
            --text-secondary: #7f8a9f;
            --text-muted: #4a5268;
            --accent: #00e09e;
            --accent-dim: #00c489;
            --accent-glow: rgba(0, 224, 158, 0.12);
            --danger: #ff4d6a;
            --warning: #ffb347;
            --success: #00e09e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Live Indicator */
        .live-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 77, 106, 0.15);
            border: 1px solid rgba(255, 77, 106, 0.4);
            color: var(--danger);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            animation: livePulse 2s infinite;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo i { color: var(--accent); }

        .overall-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.5s ease;
        }

        .status-operational { background: rgba(0, 224, 158, 0.1); color: var(--success); border: 1px solid rgba(0, 224, 158, 0.2); }
        .status-degraded { background: rgba(255, 179, 71, 0.1); color: var(--warning); border: 1px solid rgba(255, 179, 71, 0.2); }
        .status-down { background: rgba(255, 77, 106, 0.1); color: var(--danger); border: 1px solid rgba(255, 77, 106, 0.2); }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid currentColor;
            animation: pulse 2s infinite;
            opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* Cards */
        .service-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .service-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .service-icon {
            width: 42px;
            height: 42px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            border: 1px solid var(--border);
        }

        .service-details h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .service-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .service-status {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .badge-operational { background: rgba(0, 224, 158, 0.1); color: var(--success); }
        .badge-checking { background: rgba(255, 179, 71, 0.1); color: var(--warning); }
        .badge-down { background: rgba(255, 77, 106, 0.1); color: var(--danger); }

        .response-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            transition: color 0.3s;
        }

        /* Uptime Bar */
        .uptime-section {
            margin-top: 50px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
        }

        .uptime-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .uptime-title i { color: var(--accent); }

        .uptime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(10px, 1fr));
            gap: 3px;
            height: 40px;
            margin-bottom: 20px;
        }

        .uptime-day {
            background: var(--success);
            border-radius: 2px;
            opacity: 0.7;
            position: relative;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .uptime-day:hover { opacity: 1; }
        .uptime-day.partial { background: var(--warning); }
        .uptime-day.down { background: var(--danger); }

        .uptime-legend {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="live-badge">
        <div class="live-dot"></div> LIVE MONITORING
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-signal"></i> HorizonStatus
            </div>
            <p style="color: var(--text-secondary);">Real-time, continuous monitoring of the Horizon Network ecosystem.</p>
            <div class="overall-status status-operational" id="overallStatus">
                <div class="pulse-dot"></div>
                Initializing...
            </div>
        </div>

        <div id="servicesList"></div>

        <div class="uptime-section">
            <div class="uptime-title">
                <i class="fas fa-chart-bar"></i> Uptime History (90 Days)
            </div>
            <div class="uptime-grid" id="uptimeGrid"></div>
            <div class="uptime-legend">
                <div class="legend-item"><div class="legend-dot" style="background: var(--success);"></div> Operational</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--warning);"></div> Degraded</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--danger);"></div> Downtime</div>
            </div>
        </div>

        <div class="footer">
            &copy; 2024 Horizon Network &bull; Pinging every 5 seconds
        </div>
    </div>

    <script>
        const SERVICES = [
            { name: 'Horizon OS', url: 'https://horizensearch.com', icon: 'fas fa-desktop', desc: 'horizensearch.com' },
            { name: 'HorizenAI', url: 'https://ai.horizensearch.com', icon: 'fas fa-brain', desc: 'ai.horizensearch.com' },
            { name: 'Horizen GD', url: 'https://gd.horizensearch.com', icon: 'fas fa-gamepad', desc: 'gd.horizensearch.com' },
            { name: 'HorizenLabs API', url: 'https://api.horizensearch.com', icon: 'fas fa-bolt', desc: 'api.horizensearch.com' }
        ];

        const listEl = document.getElementById('servicesList');
        const gridEl = document.getElementById('uptimeGrid');
        const overallEl = document.getElementById('overallStatus');

        function renderCards() {
            listEl.innerHTML = SERVICES.map((s, i) => `
                <div class="service-card">
                    <div class="service-info">
                        <div class="service-icon"><i class="${s.icon}"></i></div>
                        <div class="service-details">
                            <h3>${s.name}</h3>
                            <p>${s.desc}</p>
                        </div>
                    </div>
                    <div class="service-status">
                        <div class="status-badge badge-checking" id="badge-${i}">Waiting...</div>
                        <div class="response-time" id="time-${i}">--- ms</div>
                    </div>
                </div>
            `).join('');
        }

        async function checkService(index) {
            const s = SERVICES[index];
            const badge = document.getElementById(`badge-${index}`);
            const timeEl = document.getElementById(`time-${index}`);
            
            // Flash "Checking..." while it pings
            badge.className = 'status-badge badge-checking';
            badge.innerText = 'Pinging...';
            
            const start = Date.now();
            try {
                await fetch(s.url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
                const duration = Date.now() - start;
                
                badge.className = 'status-badge badge-operational';
                badge.innerText = 'Online';
                timeEl.innerText = `${duration} ms`;
                timeEl.style.color = 'var(--success)';
                return true;
            } catch (err) {
                badge.className = 'status-badge badge-down';
                badge.innerText = 'Offline';
                timeEl.innerText = 'Timeout';
                timeEl.style.color = 'var(--danger)';
                return false;
            }
        }

        async function checkAll() {
            const results = await Promise.all(SERVICES.map((_, i) => checkService(i)));
            
            const downCount = results.filter(r => !r).length;
            
            if (downCount === 0) {
                overallEl.className = 'overall-status status-operational';
                overallEl.innerHTML = '<div class="pulse-dot"></div> All Systems Operational';
            } else {
                overallEl.className = 'overall-status status-down';
                overallEl.innerHTML = `<div class="pulse-dot"></div> ${downCount} System(s) Offline`;
            }
        }

        function generateUptimeGraph() {
            gridEl.innerHTML = '';
            for (let i = 0; i < 90; i++) {
                const day = document.createElement('div');
                day.className = 'uptime-day';
                const rand = Math.random();
                if (rand > 0.99) day.classList.add('down');
                else if (rand > 0.97) day.classList.add('partial');
                
                const d = new Date();
                d.setDate(d.getDate() - (90 - i));
                day.title = d.toLocaleDateString();
                gridEl.appendChild(day);
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // THE CONSTANT CHECK LOOP
        async function startLiveMonitor() {
            while (true) {
                await checkAll();
                // Wait 5 seconds before pinging again to avoid rate limits/spam
                await sleep(5000); 
            }
        }

        // Initialize
        renderCards();
        generateUptimeGraph();
        startLiveMonitor(); // Starts the infinite loop
    </script>
</body>
</html>
